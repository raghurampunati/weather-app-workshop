<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Weather</h1>

    <form id="search-form" autocomplete="off">
      <input
        id="query"
        name="q"
        type="search"
        placeholder="Search for a city…"
        aria-label="City name"
        required
      >
      <button type="submit">Go</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" class="card" hidden>
      <h2 id="city"></h2>
      <div class="reading">
        <span id="icon" class="icon"></span>
        <span id="temp" class="temp"></span>
      </div>
      <p id="description"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Precipitation</dt><dd id="precip"></dd></div>
      </dl>
      <p class="observed">Observed <time id="observed"></time></p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
