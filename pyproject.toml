[project]
name = "weather-app-workshop"
version = "0.1.0"
description = "A small FastAPI weather app built for a hands-on workshop."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weather_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
